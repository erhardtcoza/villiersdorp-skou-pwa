# Isolated app preview. No production custom-domain routes or data bindings.
name = "villiersdorp-skou-app-dev"
main = "dist/server/index.js"
account_id = "0ba56c77d4b26cfe73302244e6df2a5d"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
no_bundle = true
workers_dev = true

[[rules]]
type = "ESModule"
globs = ["**/*.js", "**/*.mjs"]

[assets]
directory = "dist/client"
binding = "ASSETS"

[observability.logs]
enabled = true

[[services]]
binding = "DEV_BACKEND"
# The dev PWA is the staffed POS V1 acceptance surface. It deliberately uses
# the isolated staging backend and never production ticket data.
service = "skou-events-staging"

[[services]]
binding = "POS_TEST_BACKEND"
service = "skou-events-staging"
